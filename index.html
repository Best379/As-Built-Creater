<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16232f"><title>CGD As-Built</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#16232f;color:#e8eef2;font:15px system-ui,sans-serif;text-align:center}#g{position:fixed;right:10px;top:10px;font-size:22px;background:none;border:0;color:#e8eef2}</style></head><body><div id="m">Loading CGD As-Built…</div><button id="g">⚙</button>
<script>
/* SETUP (4 lines): 1) Upload cgd-app.html to Drive. 2) script.google.com > New project, paste:
   function doGet(){return ContentService.createTextOutput(DriveApp.getFileById('YOUR_FILE_ID').getBlob().getDataAsString()).setMimeType(ContentService.MimeType.TEXT)}
   3) Deploy > Web app > Execute as Me, access Anyone > copy the /exec URL (it serves with CORS enabled). 4) Paste it below, or tap the gear.
   A plain Drive share link (…/file/d/ID/view) or bare file ID is also converted automatically, but Drive may block it with CORS. */
const CONFIG={SOURCE:'https://script.google.com/macros/s/AKfycbxWLu2A2CZqeM_P5F0HVkoHzJNJio-TKnySjkZ8IdaDkJ1FR6th_fF_BxL_WMGY3dUrIw/exec'};
const K='cgdCachedAppHtml',KT='cgdCachedAppTime',KS='cgdSrc',src=()=>localStorage.getItem(KS)||CONFIG.SOURCE;
function toUrl(v){v=(v||'').trim();const m=v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/)||v.match(/^([\w-]{25,})$/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:v}
async function get(ms){const u=toUrl(src());if(!u||/PASTE_/.test(u))throw Error('No source set');const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const h=await r.text();if(!/<html/i.test(h))throw Error('Not an HTML file');return h}finally{clearTimeout(t)}}
function setSrc(){const v=prompt('Drive link / File ID / Apps Script URL',src());if(v){localStorage.setItem(KS,v.trim());location.reload()}}
function run(h,off){document.open();document.write(h);document.close();
 const d=document.createElement('div'),b='border:0;border-radius:14px;padding:6px 10px;background:#19b9d6;color:#04222a;font:12px system-ui;opacity:.9';
 d.style.cssText='position:fixed;right:6px;bottom:64px;z-index:99999;display:flex;gap:6px;align-items:center;font:12px system-ui';
 d.innerHTML=(off?'<span style="background:#000c;color:#fff;padding:6px 10px;border-radius:14px" title="'+(localStorage.getItem(KT)||'')+'">Loaded from offline cache</span>':'')+'<button id="cu" style="'+b+'">🔄 Check for Update</button><button id="cg" style="'+b+'">⚙</button>';
 document.body.appendChild(d);
 d.querySelector('#cg').onclick=setSrc;
 d.querySelector('#cu').onclick=async e=>{e.target.textContent='Checking…';try{const n=await get(10000);localStorage.setItem(K,n);localStorage.setItem(KT,new Date().toISOString());location.reload()}catch(x){e.target.textContent='Update failed: '+x.message;setTimeout(()=>e.target.textContent='🔄 Check for Update',2500)}}}
async function boot(){const c=localStorage.getItem(K);if(!navigator.onLine&&c)return run(c,1);
 try{const h=await get(4000);localStorage.setItem(K,h);localStorage.setItem(KT,new Date().toISOString());run(h,0)}
 catch(e){if(c)run(c,1);else document.getElementById('m').innerHTML='Could not load the app ('+e.message+').<br>Tap ⚙ to set the source.'}}
document.getElementById('g').onclick=setSrc;boot();
</script></body></html>
